<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Beleg-Verwaltung</title>
<meta name="theme-color" content="#2b6cb0" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="app-header">
  <h1>Beleg-Verwaltung</h1>
  <div id="authArea">
    <button id="signInBtn">Mit Google anmelden</button>
    <div id="userArea" hidden>
      <span id="userEmail"></span>
      <button id="connectDriveBtn" title="Nötig, damit Fotos in dein Drive hochgeladen werden können">Drive verbinden</button>
      <button id="signOutBtn">Abmelden</button>
    </div>
  </div>
</header>

<main id="app" hidden>
  <section class="card-section" id="uploadSection">
    <h2>Neuer Beleg</h2>
    <input type="file" id="fileInput" accept="image/*" capture="environment" />
    <img id="preview" hidden alt="Vorschau" />
    <div class="button-row">
      <button type="button" id="recognizeBtn" disabled>Mit KI erkennen</button>
    </div>
    <p id="status" class="status" role="status"></p>

    <form id="entryForm">
      <label>Produkt
        <input type="text" name="product" required />
      </label>
      <label>Kategorie
        <input type="text" name="category" />
      </label>
      <label>Kaufdatum
        <input type="date" name="purchaseDate" />
      </label>
      <label>Kaufort
        <input type="text" name="purchaseLocation" />
      </label>
      <label>Preis (CHF)
        <input type="number" step="0.01" name="price" />
      </label>
      <label>Garantie bis
        <input type="date" name="warrantyUntil" />
      </label>
      <label>Physische Ablage
        <input type="text" name="physicalLocation" placeholder="z.B. Ordner 'Elektronik', Schublade 2" />
      </label>
      <label>Notizen
        <textarea name="notes" rows="2"></textarea>
      </label>
      <div class="button-row">
        <button type="submit" id="saveBtn">Speichern</button>
        <button type="button" id="cancelEditBtn" hidden>Abbrechen</button>
      </div>
    </form>
  </section>

  <section class="card-section">
    <h2>Belege</h2>
    <input type="search" id="searchInput" placeholder="Suche nach Produkt, Ort, Ablage..." />

    <h3>Aktive Garantien</h3>
    <div id="activeList" class="list"></div>

    <h3>Archiv (Garantie abgelaufen)</h3>
    <div id="archivedList" class="list"></div>
  </section>
</main>

<p id="signedOutHint">Bitte melde dich an, um deine Belege zu sehen.</p>

<script type="module" src="app.js"></script>
</body>
</html>
